name: Sync BCD data

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Default GITHUB_TOKEN pushes don't trigger other workflows (loop-prevention),
          # so the commit below wouldn't kick off deploy.yml. Use a PAT with
          # `repo` scope stored as the SYNC_PAT secret instead. Without it, this
          # workflow will still commit data updates, but you'll need to trigger
          # deploy.yml manually (or switch this job to open a PR instead, via
          # peter-evans/create-pull-request, for a human-reviewed alternative).
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install @mdn/browser-compat-data@latest

      - run: npm run sync-data

      - id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json src/data/browsers.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        run: |
          BCD_VERSION=$(node -p "require('./src/data/browsers.generated.json').meta.bcdVersion")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/data/browsers.generated.json
          git commit -m "chore: sync BCD data ($BCD_VERSION)"
          git push
